<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Building chat — House</title>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/groceries.css">
    <link rel="stylesheet" href="/css/chat.css">
    <script src="/js/lightbox.js" defer></script>
</head>
<body>

<nav>
    <a class="logo" href="/">House</a>
    <div th:replace="~{fragments/nav :: menu}"></div>
</nav>

<div th:replace="~{fragments/groceries :: groceries}"></div>

<main class="chat-main">
    <p class="sec-label">Building chat</p>
    <h2 th:text="${building.street != null}
            ? ${building.street} + ' ' + ${building.number} + ', ' + ${building.city}
            : ${building.number} + ', ' + ${building.city}">Address</h2>
    <p class="deal-meta">Everyone from your building is here.</p>

    <div class="chat-box">
        <div class="chat-messages" id="chat-messages">
            <p class="chat-empty" th:if="${messages.isEmpty()}">
                No messages yet — be the first to knock on the wall.</p>
            <div class="chat-msg" th:each="m : ${messages}"
                 th:classappend="${m.author.id == currentUser.id} ? 'own'">
                <span class="chat-author"
                      th:text="${m.author.id == currentUser.id ? 'you' : m.author.username}">author</span>
                <span class="chat-time" th:text="${m.timeLabel()}">01.01 12:00</span>
                <p class="chat-text" th:if="${!#strings.isEmpty(m.text)}" th:text="${m.text}">message text</p>
                <img class="chat-photo" th:if="${m.hasImage()}"
                     th:src="@{'/chat/building/image/' + ${m.id}}" alt="" loading="lazy">
            </div>
        </div>
        <form class="chat-form" method="post" th:action="@{/building/chat}" enctype="multipart/form-data">
            <label class="chat-attach" title="Attach a photo">
                <input type="file" name="image" accept="image/*" hidden>
            </label>
            <input type="text" name="text" maxlength="1000"
                   placeholder="Write a message…" autocomplete="off" autofocus>
            <button class="btn btn-solid" type="submit">Send</button>
        </form>
    </div>
    <p class="chat-hint">New messages don't appear on their own — refresh the page to see them.</p>
</main>

<script>
    const box = document.getElementById('chat-messages');
    if (box) box.scrollTop = box.scrollHeight;
    document.querySelectorAll('.chat-attach input').forEach(inp => {
        inp.addEventListener('change', () => {
            inp.closest('.chat-attach').classList.toggle('has-file', inp.files.length > 0);
        });
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deals — House</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/deals.css">
    <script src="/js/lightbox.js" defer></script>
</head>
<body>

<nav>
    <a class="logo" href="/">House</a>
    <div th:replace="~{fragments/nav :: menu}"></div>
</nav>

<main class="deals-main">
    <p class="sec-label">Deals</p>
    <h2>Your building's deals</h2>

    <p class="auth-error" th:if="${param.error}">Couldn't do that — check the numbers
        (and make sure your building is linked in <a href="/account">your account</a>).</p>

    <div class="deal-new">
        <div class="deal-actions">
            <button class="btn btn-solid" type="button" id="deal-toggle">Post a deal</button>
            <a class="btn" href="/building/chat">Building chat</a>
        </div>
        <form method="post" action="/deals" id="deal-form" class="deal-form"
              enctype="multipart/form-data" hidden>
            <div class="auth-field">
                <label for="d-product">Product</label>
                <input id="d-product" name="productName" required maxlength="120"
                       placeholder="e.g. Mineral water 1.5L, 6-pack promo">
            </div>
            <div class="auth-field">
                <label for="d-store">Store</label>
                <input id="d-store" name="storeName" list="stores" required maxlength="60"
                       placeholder="Biedronka">
                <datalist id="stores">
                    <option value="Biedronka">
                    <option value="Lidl">
                    <option value="Żabka">
                    <option value="Kaufland">
                    <option value="Carrefour">
                    <option value="Auchan">
                    <option value="Dino">
                    <option value="Netto">
                </datalist>
            </div>
            <div class="deal-nums">
                <div class="auth-field">
                    <label for="d-total">Units in deal</label>
                    <input id="d-total" name="totalUnits" type="number" min="2" required>
                </div>
                <div class="auth-field">
                    <label for="d-mine">I take</label>
                    <input id="d-mine" name="authorUnits" type="number" min="1" required>
                </div>
                <div class="auth-field">
                    <label for="d-price">Price/unit, zł</label>
                    <input id="d-price" name="pricePerUnit" type="number" step="0.01" min="0">
                </div>
            </div>
            <div class="auth-field">
                <label for="d-image">Photo of the product (optional)</label>
                <input id="d-image" name="image" type="file" accept="image/*" class="deal-file">
            </div>
            <button class="btn btn-solid" type="submit">Post</button>
        </form>
    </div>

    <div class="empty" th:if="${deals.isEmpty()}">
        <p class="empty-title">Nothing here yet</p>
        <p>Spotted a bulk deal in a store? Be the first to post it.</p>
    </div>

    <div class="deal-card" th:each="d : ${deals}"
         th:with="mine=${d.author.id == session.user.id}, remaining=${d.remainingUnits()}">
        <img class="deal-photo" th:if="${d.hasImage()}"
             th:src="@{'/deals/' + ${d.id} + '/image'}" alt="" loading="lazy">
        <div class="deal-head">
            <h3 th:text="${d.productName}">Product</h3>
            <span class="deal-status"
                  th:classappend="${d.status.name() == 'CLOSED'} ? 'closed'"
                  th:text="${d.status.name() == 'CLOSED'} ? 'Complete' : 'Open'">Open</span>
        </div>
        <span class="store-tag"
              th:with="sn=${#strings.toLowerCase(d.storeName)},
                       slug=${sn == 'żabka' ? 'zabka' : (sn == 'biedronka' or sn == 'lidl' or sn == 'kaufland' or sn == 'carrefour' or sn == 'auchan' or sn == 'dino' or sn == 'netto' ? sn : 'generic')}">
            <span class="store-logo" th:classappend="'store-' + ${slug}"></span>
            <span class="store-name" th:text="${d.storeName}">Store</span>
        </span>
        <p class="deal-meta">
            <span th:if="${d.pricePerUnit != null}"
                  th:text="${#numbers.formatDecimal(d.pricePerUnit, 1, 2)} + ' zł/unit · '"></span><span
                th:text="'by ' + ${mine ? 'you' : d.author.username}"></span>
        </p>
        <p class="deal-progress"
           th:text="${d.claimedUnits()} + ' of ' + ${d.totalUnits} + ' units claimed · ' + ${remaining} + ' left'"></p>
        <div class="deal-bar" aria-hidden="true">
            <span th:style="'width:' + ${d.totalUnits > 0 ? d.claimedUnits() * 100 / d.totalUnits : 0} + '%'"></span>
        </div>

        <div class="deal-mine" th:each="cl : ${d.claims}" th:if="${cl.user.id == session.user.id}">
            <span th:text="'You take ' + ${cl.units}">You take 2</span>
            <a class="btn" th:href="@{'/deals/' + ${d.id} + '/chat'}">Chat</a>
            <form method="post" th:action="@{'/deals/' + ${d.id} + '/claim/cancel'}">
                <button class="btn" type="submit">Cancel</button>
            </form>
        </div>
        <div class="deal-mine" th:if="${mine}">
            <a class="btn" th:href="@{'/deals/' + ${d.id} + '/chat'}">Chat with claimers</a>
            <form method="post" th:action="@{'/deals/' + ${d.id} + '/delete'}"
                  onsubmit="return confirm('Delete this deal? This cannot be undone.');">
                <button class="btn btn-danger" type="submit">Delete</button>
            </form>
        </div>

        <form class="deal-claim" method="post"
              th:action="@{'/deals/' + ${d.id} + '/claim'}"
              th:if="${!mine} and ${remaining} > 0">
            <input type="number" name="units" min="1" required
                   th:max="${remaining}" value="1">
            <button class="btn btn-solid" type="submit">Take</button>
        </form>
    </div>
</main>

<script>
    document.getElementById('deal-toggle')?.addEventListener('click', () => {
        const f = document.getElementById('deal-form');
        f.hidden = !f.hidden;
    });
</script>
</body>
</html>

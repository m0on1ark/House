<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="groceries">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <g id="g-milk">
                <polygon points="8,20 22,8 36,20" fill="#d8d2c4"/>
                <rect x="8" y="20" width="28" height="38" fill="#eae5d8"/>
                <rect x="8" y="32" width="28" height="10" fill="#77808c"/>
            </g>
            <g id="g-apple">
                <circle cx="20" cy="24" r="14" fill="#c1554d"/>
                <path d="M20 11 q1 -6 6 -8" stroke="#57534b" stroke-width="2" fill="none"/>
                <ellipse cx="27" cy="8" rx="5" ry="3" fill="#6d7a4f" transform="rotate(-20 27 8)"/>
            </g>
            <g id="g-bread">
                <rect x="2" y="8" width="52" height="22" rx="11" fill="#c99a5b"/>
                <path d="M13 12 q3 4 0 8 M25 11 q3 4 0 8 M37 11 q3 4 0 8 M46 13 q3 4 0 7"
                      stroke="#a87b41" stroke-width="2" fill="none" stroke-linecap="round"/>
            </g>
            <g id="g-cheese">
                <polygon points="2,30 46,30 46,8" fill="#e8bd55"/>
                <circle cx="36" cy="24" r="3.4" fill="#c69b32"/>
                <circle cx="26" cy="27" r="2.2" fill="#c69b32"/>
                <circle cx="41" cy="16" r="2.6" fill="#c69b32"/>
            </g>
            <g id="g-bottle">
                <rect x="10" y="2" width="8" height="12" fill="#57534b"/>
                <path d="M10 14 C4 20 4 26 4 30 V56 Q4 60 8 60 H20 Q24 60 24 56 V30 C24 26 24 20 18 14 Z"
                      fill="#6d7a5e"/>
                <rect x="7" y="34" width="14" height="12" fill="#eae5d8"/>
            </g>
            <g id="g-can">
                <rect x="4" y="6" width="28" height="38" rx="4" fill="#a8a49c"/>
                <rect x="4" y="16" width="28" height="16" fill="#b0603f"/>
                <ellipse cx="18" cy="6" rx="14" ry="4" fill="#c4bfb4"/>
            </g>
        </defs>
    </svg>
    <div class="groceries groceries-fixed">
        <svg viewBox="0 0 44 64" class="fall-a" style="left:4%;  width:40px; animation-duration:13s; animation-delay:-2s;"><use href="#g-milk"/></svg>
        <svg viewBox="0 0 40 40" class="fall-b" style="left:13%; width:32px; animation-duration:10s; animation-delay:-7s;"><use href="#g-apple"/></svg>
        <svg viewBox="0 0 56 32" class="fall-a" style="left:22%; width:50px; animation-duration:15s; animation-delay:-11s;"><use href="#g-bread"/></svg>
        <svg viewBox="0 0 48 36" class="fall-b" style="left:31%; width:42px; animation-duration:11s; animation-delay:-4s;"><use href="#g-cheese"/></svg>
        <svg viewBox="0 0 28 64" class="fall-a" style="left:40%; width:24px; animation-duration:14s; animation-delay:-9s;"><use href="#g-bottle"/></svg>
        <svg viewBox="0 0 36 48" class="fall-b" style="left:56%; width:30px; animation-duration:12s; animation-delay:-1s;"><use href="#g-can"/></svg>
        <svg viewBox="0 0 40 40" class="fall-a" style="left:65%; width:26px; animation-duration:16s; animation-delay:-13s;"><use href="#g-apple"/></svg>
        <svg viewBox="0 0 44 64" class="fall-b" style="left:74%; width:34px; animation-duration:11s; animation-delay:-6s;"><use href="#g-milk"/></svg>
        <svg viewBox="0 0 48 36" class="fall-a" style="left:83%; width:36px; animation-duration:14s; animation-delay:-10s;"><use href="#g-cheese"/></svg>
        <svg viewBox="0 0 56 32" class="fall-b" style="left:91%; width:44px; animation-duration:12s; animation-delay:-3s;"><use href="#g-bread"/></svg>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${(resident.fullName != null ? resident.fullName : resident.username) + ' — House'}">Resident — House</title>
    <th:block th:replace="~{fragments/theme :: init}"></th:block>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/groceries.css">
    <link rel="stylesheet" href="/css/account.css">
    <link rel="stylesheet" href="/css/residents.css">
</head>
<body>

<nav>
    <a class="logo" href="/">House</a>
    <div th:replace="~{fragments/nav :: menu}"></div>
</nav>

<div th:replace="~{fragments/groceries :: groceries}"></div>

<main class="account-main">
    <a class="back-link" href="/residents">← Back to neighbours</a>
    <p class="sec-label">Neighbour</p>

    <div class="account-card profile-card">
        <div class="account-head">
            <div class="avatar-wrap">
                <img class="account-avatar" th:if="${resident.hasAvatar()}"
                     th:src="@{'/residents/' + ${resident.id} + '/avatar'}" alt="Avatar">
                <svg class="account-avatar" th:unless="${resident.hasAvatar()}" viewBox="0 0 60 74" aria-hidden="true">
                    <rect x="0" y="0" width="60" height="74" fill="#262626"/>
                    <rect x="10" y="7" width="40" height="51" fill="#b8b1a2"/>
                    <rect x="13.5" y="10.5" width="33" height="44" fill="#413e37"/>
                    <path d="M13.5 10.5 h7.5 q-3 11 0 22 q-3 11 0 22 h-7.5 z" fill="#d8cec0"/>
                    <path d="M46.5 10.5 h-7.5 q3 11 0 22 q3 11 0 22 h7.5 z" fill="#d8cec0"/>
                    <polygon points="13.5,10.5 5,5 5,60 13.5,54.5" fill="#d5cec1"/>
                    <polygon points="46.5,10.5 55,5 55,60 46.5,54.5" fill="#d5cec1"/>
                    <path d="M17 59 q0 -15 13 -15 q13 0 13 15 z" fill="#b0603f"/>
                    <rect x="13" y="49" width="9" height="10" rx="4.5" fill="#b0603f"/>
                    <rect x="38" y="49" width="9" height="10" rx="4.5" fill="#b0603f"/>
                    <circle cx="17.5" cy="58" r="3.4" fill="#e8b98a"/>
                    <circle cx="42.5" cy="58" r="3.4" fill="#e8b98a"/>
                    <circle cx="30" cy="33" r="11.5" fill="#e8b98a"/>
                    <path d="M19.6 28 a11.5 11.5 0 0 1 20.8 0 z" fill="#1c1c1c"/>
                    <circle cx="25.8" cy="33" r="1.7" fill="#1c1c1c"/>
                    <circle cx="34.2" cy="33" r="1.7" fill="#1c1c1c"/>
                    <path d="M27.4 38.5 q2.6 2.2 5.2 0" stroke="#1c1c1c" stroke-width="1.4"
                          fill="none" stroke-linecap="round"/>
                    <rect x="8" y="58" width="44" height="5" fill="#57534b"/>
                </svg>
            </div>
            <div class="account-head-text">
                <h1 th:text="${resident.fullName != null ? resident.fullName : resident.username}">Name</h1>
                <p>Resident of House · <span th:text="'@' + ${resident.username}">@username</span></p>
                <p class="account-bio" th:if="${resident.bio != null}" th:text="${resident.bio}">bio</p>
            </div>
        </div>

        <dl class="account-fields">
            <div class="field">
                <dt>Building</dt>
                <dd th:if="${buildingAddress != null}" th:text="${buildingAddress}">street, city</dd>
                <dd th:unless="${buildingAddress != null}" class="dd-muted">Not linked</dd>
            </div>
            <div class="field">
                <dt>Floor</dt>
                <dd th:if="${resident.floor != null}" th:text="${resident.floor}">3</dd>
                <dd th:unless="${resident.floor != null}" class="dd-muted">Not set</dd>
            </div>
            <div class="field">
                <dt>Apartment</dt>
                <dd th:if="${resident.apartment != null}" th:text="${resident.apartment}">12</dd>
                <dd th:unless="${resident.apartment != null}" class="dd-muted">Not set</dd>
            </div>
        </dl>

        <a class="btn btn-solid profile-edit-btn" href="/building/chat">Message in building chat</a>
    </div>
</main>

<script src="/js/main.js" defer></script>
</body>
</html>

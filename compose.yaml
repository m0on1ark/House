services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: house
      POSTGRES_USER: house_user
      POSTGRES_PASSWORD: choco_2005
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U house_user -d house"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/house
      SPRING_DATASOURCE_USERNAME: house_user
      SPRING_DATASOURCE_PASSWORD: choco_2005
    ports:
      - "8080:8080"

volumes:
  pgdata:

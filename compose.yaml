services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-house}
      POSTGRES_USER: ${DB_USER:-house_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-choco_2005}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-house}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-house_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-choco_2005}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
